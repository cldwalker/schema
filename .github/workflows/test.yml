name: Tests
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install babashka
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: 1.13.229
      - name: Run bb tests
        run: bb clj:test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Install clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673

      - run: clojure -M:clj-kondo --lint src test
